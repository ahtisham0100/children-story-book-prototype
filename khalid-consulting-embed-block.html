<script>
  function showScreen(name) {
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
    var target = document.getElementById('screen-' + name);
    if (target) target.classList.add('active');

    var btns = document.querySelectorAll('.nav-btn');
    for (var j = 0; j < btns.length; j++) {
      btns[j].classList.toggle('active', btns[j].getAttribute('data-screen') === name);
    }
    // Remember the screen in the URL hash without jumping the page
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Deep-link support: open #about or #portfolio directly
  (function () {
    var h = (location.hash || '').replace('#', '');
    if (h === 'about' || h === 'portfolio') showScreen(h);
  })();
